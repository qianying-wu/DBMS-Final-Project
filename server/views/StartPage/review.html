<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用戶評價 - 競賽組隊</title>
    <link rel="stylesheet" href="/profile.css"> <link rel="stylesheet" href="/review.css">
  </head>
  <body>
    <header class="topbar">
      <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
      <div class="actions">
        <button id="notifyBtn" class="icon-btn" aria-label="通知">🔔</button>
        <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">👤</button>
      </div>
    </header>

    <main class="layout profile-layout">
      <div class="profile-heading" style="margin-bottom: 24px;">
        <h2 class="page-title">用戶評價</h2>
        <p>為曾經合作過的隊友留下真實的評價與建議。</p>
      </div>

      <div class="split-layout">
        
        <section class="resume-column">
          <div class="resume-card" id="resumeCard">
            <div class="resume-header">
              <div class="resume-avatar">履歷</div>
              <div class="resume-title-info">
                <span class="resume-template-name">標準履歷模板</span>
                <h3 class="resume-title" id="r-title">載入中...</h3>
                <span class="resume-school" id="r-school"></span>
              </div>
            </div>
            <div class="resume-body">
              <div class="resume-section">
                <h4>基本資料</h4>
                <div class="basic-info-grid">
                  <div class="info-box">
                    <span class="info-label">姓名</span>
                    <span class="info-value" id="r-name">-</span>
                  </div>
                  <div class="info-box">
                    <span class="info-label">學校 / 年級</span>
                    <span class="info-value" id="r-grade">-</span>
                  </div>
                </div>
              </div>
              <div class="resume-section">
                <h4>專長</h4>
                <div class="skills-container" id="r-skills">
                  </div>
              </div>
              <div class="resume-section">
                <h4>個人經歷</h4>
                <p id="r-exp">-</p>
              </div>
              <div class="resume-section">
                <h4>自我介紹</h4>
                <p id="r-intro">-</p>
              </div>
            </div>
          </div>
        </section>

        <section class="review-column">
          <div class="card editor-card" style="margin-bottom: 24px;">
            <div class="editor-heading">
              <div>
                <span class="eyebrow">撰寫評價</span>
                <h2>評價此用戶</h2>
              </div>
            </div>
            <form id="reviewForm">
              <div class="row">
                <label class="full">評分
                  <div class="star-rating" id="starRating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                  </div>
                </label>
              </div>
              <div class="row">
                <label class="full">留言內容
                  <textarea id="reviewComment" placeholder="請描述你與這位用戶合作的經驗..." rows="4"></textarea>
                </label>
              </div>
              <div class="actions-row">
                <button id="submitReviewBtn" type="button" class="btn primary">發布評價</button>
              </div>
            </form>
          </div>

          <div class="card editor-card">
            <div class="editor-heading">
              <h2>歷史評價記錄</h2>
            </div>
            <div id="reviewList" class="review-list">
              </div>
          </div>
        </section>

      </div>
    </main>

    <script src="/review.js"></script>
  </body>
</html>
