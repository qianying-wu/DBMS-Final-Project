<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>組隊瀏覽 / 發起隊伍</title>
  <link rel="stylesheet" href="/team.css">
</head>

<body>
  <header class="topbar">
    <a id="homeLink" href="/team.html">
      <img src="/logo.png" alt="競賽組隊 Logo" class="logo-img">
    </a>
    <input type="text" id="globalSearch" class="global-search-input" placeholder="搜尋比賽、隊伍或用戶...">
    <div class="actions">
      <!--右上個人設定和通知的icon-->
     <div class="actions">
  <button id="notifyBtn" class="icon-btn" aria-label="通知">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
  </button>
  <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  </button>
</div>
  </header>

  <main class="layout">
    <aside class="sidebar left">
      <button id="openCreate" class="btn primary block">發起招募</button>

      <div class="section section-contests">
        <h4>比賽類別</h4>
        <!-- 比賽類別會由 team.js 依照標籤動態產生，點擊類別後展開對應比賽。 -->
        <ul id="contestsList" class="simple-list"></ul>
      </div>
    </aside>

    <section class="content">
      <!-- 廣告輪播 -->
      <div id="adCarousel" class="carousel">
        <div class="carousel-inner">
          <div class="carousel-item">
            <img src="/ads.png" alt="廣告 1">
          </div>
          <div class="carousel-item">
            <img src="/ads2.png" alt="廣告 2">
          </div>
          <div class="carousel-item">
            <img src="/ads3.png" alt="廣告 3">
          </div>
        </div>
      </div>

      <div class="hero">
        <div class="hero-left">
          <h2>比賽總覽</h2>
          <p>查看全部比賽，或進入比賽頁瀏覽正在招募的隊伍。</p>
        </div>
      </div>

      <div id="contestsGrid" class="contests-grid"></div>
    </section>

    <aside class="sidebar right">
      <section class="side-card side-card-team" data-collapsible-card="teams">
        <button class="side-card-toggle" type="button" data-card-toggle aria-expanded="true">我的隊伍</button>
        <div class="side-card-body">
          <div class="team-tabs" role="tablist">
            <button class="team-tab" data-my-team-tab="joined" type="button">已加入的隊伍</button>
            <button class="team-tab" data-my-team-tab="owned" type="button">我建立的隊伍</button>
          </div>
          <div id="myJoinedTeams" class="box my-team-panel" hidden>尚未加入隊伍</div>
          <div id="myOwnedTeams" class="box my-team-panel" hidden>尚未建立隊伍</div>
        </div>
      </section>

      <section class="side-card side-card-fav" data-collapsible-card="favorites">
        <button class="side-card-toggle" type="button" data-card-toggle aria-expanded="true">我的收藏隊伍</button>
        <div class="side-card-body">
          <div id="myFavs" class="box">尚無收藏隊伍</div>
        </div>
      </section>

      <section class="side-card side-card-follow" data-collapsible-card="followed">
        <button class="side-card-toggle" type="button" data-card-toggle aria-expanded="true">關注的比賽 / 訊息</button>
        <div class="side-card-body">
          <div id="followed" class="list box">無</div>
        </div>
      </section>

      <!-- 個人化推薦區：固定放在右側欄位最下方。 -->
      <section id="recommendedContests" class="side-card side-card-recommend recommended-contests"
        data-collapsible-card="recommendations">
        <button class="side-card-toggle" type="button" data-card-toggle aria-expanded="true">推薦比賽</button>
        <div id="recommendedBody" class="side-card-body"></div>
      </section>
    </aside>
  </main>

  <!-- create modal simple -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" role="document">
      <h3>創建新隊伍</h3>
      <div class="modal-row">
        <label class="modal-label">隊名
          <input id="newTeamName">
        </label>
        <label class="modal-label">主題/說明
          <textarea id="newTeamDesc" rows="3"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button id="modalCreate" class="btn primary">建立</button>
        <button id="modalCancel" class="btn outline">取消</button>
      </div>
    </div>
  </div>

  <div id="globalSearchOverlay" class="global-search-overlay hidden">
    <div class="search-overlay-content">
      <div class="search-header">
        <button id="btnExitSearch" class="btn outline">← 返回</button>
        <div class="search-tabs">
          <div class="s-tab" data-tab="comp">競賽資訊</div>
          <div class="s-tab active" data-tab="team">隊伍列表</div>
          <div class="s-tab" data-tab="user">用戶列表</div>
        </div>
      </div>
      <div id="globalSearchResults" class="search-results-list"></div>
    </div>
  </div>

  <!-- requests modal -->
  <div id="requestsModal" class="modal hidden requests-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>待審核的加入申請</h3>
      <div id="requestsList"></div>
      <div class="modal-actions">
        <button id="closeReq" class="btn outline">關閉</button>
      </div>
    </div>
  </div>

  <!-- 未登入互動提醒：首頁可瀏覽，進一步查看或操作時才要求登入。 -->
  <div id="loginPromptModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card login-required-card">
      <h3>需要先登入</h3>
      <p id="loginPromptMessage">這個功能需要登入後才能使用。</p>
      <div class="modal-actions">
        <button id="loginPromptCancel" class="btn outline">先逛逛</button>
        <button id="loginPromptLogin" class="btn primary">前往登入</button>
      </div>
    </div>
  </div>
<script src="/preferences.js"></script>
<script src="/auth-guard.js"></script>
<script src="/account-menu.js"></script>
<script src="/notifications.js"></script>
<script>
  // bind notify button to shared notifications module but require login first
  (function(){
    function isLoggedIn(){
      const id = localStorage.getItem('userId') || new URLSearchParams(location.search).get('userId');
      return Boolean(id && id !== 'unknown');
    }

    function showLoginPrompt(){
      const loginPromptModal = document.getElementById('loginPromptModal');
      const loginPromptMessage = document.getElementById('loginPromptMessage');
      if (loginPromptMessage) loginPromptMessage.textContent = '此功能需要登入後才能使用。';
      if (loginPromptModal) {
        loginPromptModal.classList.remove('hidden');
        document.body.classList.add('modal-open');
        return;
      }
      // fallback redirect to auth
      location.href = `/auth.html?redirect=${encodeURIComponent(location.pathname + location.search)}`;
    }

    function bindNotify(){
      const btn = document.getElementById('notifyBtn');
      if (!btn) return;
      btn.addEventListener('click', (e)=>{
        if (!isLoggedIn()) { showLoginPrompt(); return; }
        if (window.AppNotifications && typeof window.AppNotifications.bind === 'function') {
          window.AppNotifications.bind(btn);
        } else if (typeof window.showNotifications === 'function') {
          window.showNotifications();
        } else {
          // fallback: go to profile page
          location.href = '/profile.html';
        }
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindNotify);
    else bindNotify();
  })();
</script>
<script type="module" src="team.js"></script>

</body>

</html>
