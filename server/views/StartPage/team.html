<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>組隊瀏覽 / 發起隊伍</title>
  <link rel="stylesheet" href="/team.css">
</head>

<body>
  <header class="topbar">
    <a id="homeLink" href="/team.html">
      <img src="/logo.png" alt="競賽組隊 Logo" class="logo-img">
    </a>
    <input type="text" id="globalSearch" class="global-search-input" placeholder="搜尋比賽、隊伍或用戶...">
    <div class="actions">
      <button id="notifyBtn" class="icon-btn" aria-label="通知">🔔</button>
      <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">👤</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar left">
      <button id="openCreate" class="btn primary block">發起招募</button>

      <div class="section section-contests">
        <h4>比賽</h4>
        <!-- 比賽類別會由 team.js 依照標籤動態產生，點擊類別後展開對應比賽。 -->
        <ul id="contestsList" class="simple-list"></ul>
      </div>
    </aside>

    <section class="content">
      <!-- 廣告輪播 -->
      <div id="adCarousel" class="carousel">
        <div class="carousel-inner">
          <div class="carousel-item" style="background: #fdfaf7;">廣告橫幅 1：最新賽事報名中</div>
          <div class="carousel-item" style="background: #f6efe6;">廣告橫幅 2：尋找你的神隊友</div>
          <div class="carousel-item" style="background: #fff8ef;">廣告橫幅 3：企業贊助獎金加碼</div>
        </div>
      </div>

      <div class="hero">
        <div class="hero-left">
          <h2>比賽總覽</h2>
          <p>查看全部比賽、進入比賽頁瀏覽隊伍，或建立自己的招募。</p>
        </div>
        <div class="hero-right">
          <button id="createBtn" class="btn primary">創建自己的隊伍 +</button>
        </div>
      </div>

      <div id="contestsGrid" class="contests-grid"></div>
      <div id="teamsGrid" class="teams-grid"></div>
    </section>

    <aside class="sidebar right">
      <section class="side-card side-card-team">
        <h4>我的隊伍</h4>
        <div class="team-tabs" role="tablist">
          <button class="team-tab" data-my-team-tab="joined" type="button">已加入的隊伍</button>
          <button class="team-tab" data-my-team-tab="owned" type="button">我建立的隊伍</button>
        </div>
        <div id="myJoinedTeams" class="box my-team-panel" hidden>尚未加入隊伍</div>
        <div id="myOwnedTeams" class="box my-team-panel" hidden>尚未建立隊伍</div>
      </section>

      <section class="side-card side-card-fav">
        <h4>我的收藏</h4>
        <div id="myFavs" class="box">尚無收藏</div>
      </section>

      <section class="side-card side-card-follow">
        <h4>關注的比賽 / 訊息</h4>
        <div id="followed" class="list box">無</div>
      </section>

      <!-- 個人化推薦區：固定放在右側欄位最下方。 -->
      <section id="recommendedContests" class="recommended-contests"></section>
    </aside>
  </main>

  <!-- create modal simple -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" role="document">
      <h3>創建新隊伍</h3>
      <div class="modal-row">
        <label class="modal-label">隊名
          <input id="newTeamName">
        </label>
        <label class="modal-label">主題/說明
          <textarea id="newTeamDesc" rows="3"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button id="modalCreate" class="btn primary">建立</button>
        <button id="modalCancel" class="btn outline">取消</button>
      </div>
    </div>
  </div>

  <div id="globalSearchOverlay" class="global-search-overlay hidden">
    <div class="search-overlay-content">
      <div class="search-header">
        <button id="btnExitSearch" class="btn outline">← 返回</button>
        <div class="search-tabs">
          <div class="s-tab" data-tab="comp">競賽資訊</div>
          <div class="s-tab active" data-tab="team">隊伍列表</div>
          <div class="s-tab" data-tab="user">用戶列表</div>
        </div>
      </div>
      <div id="globalSearchResults" class="search-results-list"></div>
    </div>
  </div>

  <!-- requests modal -->
  <div id="requestsModal" class="modal hidden requests-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>待審核的加入申請</h3>
      <div id="requestsList"></div>
      <div class="modal-actions">
        <button id="closeReq" class="btn outline">關閉</button>
      </div>
    </div>
  </div>
  <script src="/notifications.js"></script>
  <script src="/account-menu.js"></script>
  <script src="/preferences.js"></script>
  <script type="module" src="team.js"></script>
</body>

</html>
