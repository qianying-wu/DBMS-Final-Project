<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>發起招募</title>
    <link rel="stylesheet" href="/create-team.css">
  </head>
  <body>
    <!-- 頁首：返回組隊頁、Logo、通知與帳號選單。 -->
    <header class="topbar">
      <button id="backBtn" class="icon-btn" aria-label="回到組隊">←</button>
      <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
       <!--右上的通知和個人icon圖示-->
      <div class="actions">
       <button id="notifyBtn" class="icon-btn" aria-label="通知">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </svg>
</button>
<button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
  </svg>
</button>
      </div>
    </header>

    <!-- 單欄主畫面：只保留建立隊伍需要填寫的內容。 -->
    <main class="create-layout">
      <section class="main-panel">
        <div class="page-heading">
          <span class="eyebrow">Recruitment</span>
          <h1>發起招募</h1>
          <p>請先搜尋並選擇資料庫中已有的比賽，再填寫隊伍招募資訊。</p>
        </div>

        <form id="createForm" class="create-form">
          <!-- 比賽選擇：只能從既有比賽中搜尋選取，不提供新增比賽。 -->
          <section class="contest-picker full">
            <div class="section-heading">
              <div>
                <h2>選擇比賽</h2>
                <p>輸入比賽名稱關鍵字，從搜尋結果中選擇要發起招募的比賽。</p>
              </div>
            </div>

            <label class="full">
              搜尋比賽
              <input id="contestSearch" type="search" placeholder="例如：資料科學、黑客松、金融科技">
              <div id="searchResultList"></div>
            </label>

            <input id="contestSelect" type="hidden">
            <div id="contestResults" class="contest-results"></div>
          </section>

          <!-- 隊伍基本資料。 -->
          <label>
            隊伍名稱
            <input id="teamName" type="text" placeholder="例如：AI 聯合隊">
          </label>

          <label>
            隊伍人數上限
            <input id="teamSlots" type="number" min="1" max="12" value="4">
          </label>

          <label class="full">
            招募需求
            <input id="teamSkills" type="text" placeholder="例如：前端、資料分析、簡報">
          </label>

          <label class="full">
            主題 / 說明
            <textarea id="teamDesc" rows="6" placeholder="簡短描述隊伍方向、目前進度、希望找到的成員"></textarea>
          </label>

          <!-- 申請設定：是否要求履歷，以及申請者需要回答的問題。 -->
          <label class="full check-row">
            <input id="requireResume" type="checkbox">
            要求申請者附上履歷
          </label>

          <section class="questions-section full">
            <div class="questions-heading">
              <div>
                <h3>給申請人的提問</h3>
                <p>申請人送出加入申請前會先回答這些問題。</p>
              </div>
              <button id="addQuestion" class="add-question-btn" type="button" aria-label="新增提問">+</button>
            </div>
            <div id="questionsList" class="questions-list"></div>
          </section>

          <!-- 表單操作。 -->
          <div class="form-actions">
            <button id="cancelBtn" class="btn outline" type="button">取消</button>
            <button class="btn primary" type="submit">送出招募</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script src="/create-team.js"></script>
  </body>
</html>
