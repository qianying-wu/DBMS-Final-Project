<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>帳號資訊</title>
    <link rel="stylesheet" href="/profile.css">
  </head>
  <body>
    <header class="topbar">
      <a class="logo-link" href="/team.html"><div class="logo">競賽組隊</div></a>
      <div class="actions">
        <button id="notifyBtn" class="icon-btn" aria-label="通知">🔔</button>
        <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">👤</button>
      </div>
      <div class="loginBtn">
        <a href="auth.html">登入</a>
      </div>
    </header>
    <main class="layout" style="grid-template-columns:1fr;max-width:780px;margin:0 auto">
      <section class="content">
        <h2 class="page-title">帳號資訊</h2>
        <div class="card">
          <div class="sync-item"><strong>使用者 ID</strong><span id="accountUserId"></span></div>
          <div class="sync-item"><strong>帳號狀態</strong><span>本機測試帳號</span></div>
          <div class="sync-item"><strong>履歷數量</strong><span id="resumeCount"></span></div>
        </div>
      </section>
    </main>
    <script src="/auth-guard.js"></script>
    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script>
      const qs = new URLSearchParams(location.search);
      const id = qs.get('userId') || 'unknown';
      document.querySelector('.logo-link').href = '/user.html?userId=' + encodeURIComponent(id);
      document.getElementById('accountUserId').textContent = id;
      document.getElementById('resumeCount').textContent = JSON.parse(localStorage.getItem('profiles') || '[]').length + ' 份';
    </script>
  </body>
</html>
