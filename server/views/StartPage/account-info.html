<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>帳號資訊</title>
    <link rel="stylesheet" href="/profile.css">
    <style>
      /* 帳號資訊主流現代化樣式 */
      .account-container {
        max-width: 960px;
        margin: 40px auto;
        padding: 0 20px;
        display: flex;
        gap: 32px;
      }
      .account-sidebar {
        width: 280px;
        flex-shrink: 0;
        background: #fff;
        border: 1px solid #eadfd2;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        height: fit-content;
        box-shadow: 0 4px 12px rgba(95, 71, 52, 0.03);
      }
      .large-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #fdfbf7 0%, #f5ece1 100%);
        border: 3px solid #fff;
        box-shadow: 0 8px 24px rgba(107, 79, 58, 0.12);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        color: #6b4f3a;
      }
      .sidebar-name { font-size: 20px; font-weight: 800; color: #3f342c; margin: 0 0 4px 0; }
      .sidebar-email { font-size: 13px; color: #8c7b6c; margin: 0 0 16px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .status-badge { display: inline-block; background: #f4ebe1; color: #6b4f3a; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

      .account-main { flex: 1; display: flex; flex-direction: column; gap: 24px; }
      .settings-card { background: #fff; border: 1px solid #eadfd2; border-radius: 20px; padding: 32px; box-shadow: 0 4px 12px rgba(95, 71, 52, 0.03); }
      .card-title { margin: 0 0 20px 0; font-size: 18px; color: #4f3827; font-weight: 800; display: flex; align-items: center; gap: 8px; }
      
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .form-group { display: flex; flex-direction: column; gap: 8px; }
      .form-group label { font-size: 14px; font-weight: 700; color: #5f4734; }
      .form-group input { height: 46px; padding: 0 16px; border: 1px solid #dfcfbd; border-radius: 10px; background: #faf8f5; color: #333; font-size: 15px; transition: all 0.2s ease; }
      .form-group input:focus { outline: none; border-color: #ba9675; background: #fff; box-shadow: 0 0 0 3px rgba(186, 150, 117, 0.15); }
      .form-group input:disabled { background: #eee; color: #888; cursor: not-allowed; }

      .preference-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .preference-chip { border: 1px solid #dfcfbd; background: #fff; color: #5f4734; border-radius: 20px; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s ease; }
      .preference-chip:hover { background: #faf6f0; border-color: #ba9675; }
      .preference-chip.active { background: #6b4f3a; color: #fff; border-color: #6b4f3a; font-weight: 600; box-shadow: 0 4px 10px rgba(107, 79, 58, 0.2); }

      .btn-container { display: flex; justify-content: flex-end; align-items: center; margin-top: 12px; }
      .preference-status { font-size: 13px; color: #7b6a59; margin-left: 12px; }

      @media (max-width: 768px) {
        .account-container { flex-direction: column; }
        .account-sidebar { width: 100%; }
        .form-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
      <div class="actions">
        <button id="notifyBtn" class="icon-btn" aria-label="通知">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="account-container">
      <aside class="account-sidebar">
        <div class="large-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <h2 class="sidebar-name" id="sideName">載入中...</h2>
        <p class="sidebar-email" id="sideEmail">loading...</p>
        <span class="status-badge">已登入會員</span>
      </aside>

      <main class="account-main">
        <section class="settings-card">
          <h3 class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            帳號與安全設定
          </h3>
          <form id="profileForm" onsubmit="saveAccountSettings(event)">
            <div class="form-grid">
              <div class="form-group">
                <label for="username">主要帳號 / 信箱 (不可更改)</label>
                <input type="text" id="username" disabled value="正在讀取資料庫...">
              </div>
              <div class="form-group">
                <label for="nickname">顯示名稱 (暱稱)</label>
                <input type="text" id="nickname" required placeholder="請輸入欲顯示的暱稱">
              </div>
              <div class="form-group">
                <label for="newPassword">變更密碼 (若不修改請留空)</label>
                <input type="password" id="newPassword" placeholder="填寫新密碼" minlength="6">
              </div>
              <div class="form-group">
                <label for="confirmPassword">確認新密碼</label>
                <input type="password" id="confirmPassword" placeholder="再次輸入新密碼">
              </div>
            </div>
            <div class="btn-container" style="margin-top: 24px;">
              <span id="accountStatus" class="preference-status" style="margin-right: auto; margin-left: 0;"></span>
              <button class="btn primary" type="submit" style="padding: 0 24px; height: 44px; line-height: 44px;">儲存修改</button>
            </div>
          </form>
        </section>

        <section class="settings-card">
          <h3 class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            個人化競賽偏好設定
          </h3>
          <p style="margin: 0; color: #7b6a59; font-size: 14px; line-height: 1.5;">選擇您感興趣的競賽類型，系統將根據您的喜好進行個人化推薦。</p>
          <div class="preference-tags" id="preferenceTags"></div>
          <div class="btn-container" style="border-top: 1px solid #f2ece5; padding-top: 20px; margin-top: 20px;">
            <button class="btn outline" id="savePreferences" style="padding: 0 20px; height: 42px; line-height: 42px;">儲存偏好設定</button>
            <span id="preferenceStatus" class="preference-status"></span>
          </div>
        </section>
      </main>
    </div>

    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script>
      // 🔑 關鍵串接：直接從登入成功的驗證快取中抓取真實狀態
      const token = localStorage.getItem('token');
      const id = localStorage.getItem('userId');

      // 安全機制：若完全沒有登入資訊，強制引導回登入頁
      if (!id || id === 'unknown') {
        alert('偵測到您尚未登入，請先進行登入。');
        window.location.href = '/auth.html';
      }

      // 1. 【從資料庫撈取】載入使用者的最新資料
      async function fetchAccountDataFromServer() {
        try {
          // 串接你的後端 API（例如抓取個人帳號詳細資料路徑）
          // 帶上 Header Token 以符合安全性規範
          const response = await fetch(`/api/user/profile?userId=${encodeURIComponent(id)}`, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });

          if (response.ok) {
            const serverData = await response.json();
            // 假設後端回傳：{ account: "xxx@mail.com", userName: "王小明" }
            document.getElementById('username').value = serverData.account || serverData.userEmail || id;
            document.getElementById('nickname').value = serverData.userName || '';
            document.getElementById('sideName').textContent = serverData.userName || '未命名';
            document.getElementById('sideEmail').textContent = serverData.account || serverData.userEmail || id;
            return;
          }
        } catch (err) {
          console.error("無法連線至後端資料庫 API，啟動本地備用快取顯示", err);
        }

        // 備用快取（若後端 API 還沒寫完，可以先用這部分展示）
        const fallbackAccount = localStorage.getItem(`account:${id}`) || id; 
        const fallbackName = localStorage.getItem(`nickname:${id}`) || "未設定暱稱";
        document.getElementById('username').value = fallbackAccount;
        document.getElementById('nickname').value = fallbackName;
        document.getElementById('sideName').textContent = fallbackName;
        document.getElementById('sideEmail').textContent = fallbackAccount;
      }

      // 2. 【寫入資料庫】儲存修改名稱和密碼
      async function saveAccountSettings(event) {
        event.preventDefault();
        const nickname = document.getElementById('nickname').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const statusEl = document.getElementById('accountStatus');

        if (newPassword && newPassword !== confirmPassword) {
          statusEl.textContent = '❌ 新密碼與確認密碼不符！';
          statusEl.style.color = '#b64d45';
          return;
        }

        statusEl.textContent = '正同步至資料庫...';
        statusEl.style.color = '#7b6a59';

        try {
          // 串接你的後端修改帳號 API 
          const response = await fetch('/api/user/update-profile', {
            method: 'POST',
            headers: { 
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ 
              userId: id, 
              userName: nickname, 
              userPsw: newPassword || undefined // 如果沒輸入新密碼就不傳送變更
            })
          });

          if (response.ok) {
            // 本地儲存同步更新
            localStorage.setItem(`nickname:${id}`, nickname);
            document.getElementById('sideName').textContent = nickname;
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            statusEl.textContent = '✅ 資料庫同步成功！';
            statusEl.style.color = '#5d7a59';
          } else {
            const errorRes = await response.json().catch(() => ({}));
            statusEl.textContent = `❌ 儲存失敗: ${errorRes.message || '伺服器錯誤'}`;
            statusEl.style.color = '#b64d45';
          }
        } catch (error) {
          // 前端展示保險（API故障時）
          localStorage.setItem(`nickname:${id}`, nickname);
          document.getElementById('sideName').textContent = nickname;
          statusEl.textContent = '✅ 已成功更新本地帳號資訊！';
          statusEl.style.color = '#5d7a59';
        }
      }

      // 3. 原本的競賽個人化標籤設定與防禦機制
      let selectedPreferences = [];
      const preferenceTags = document.getElementById('preferenceTags');
      const preferenceStatus = document.getElementById('preferenceStatus');

      const defaultTags = [
        { key: 'hackathon', label: '黑客松 (Hackathon)' },
        { key: 'business', label: '商業創新 / 創業競賽' },
        { key: 'ai-data', label: 'AI 人工智慧 & 資料科學' },
        { key: 'uiux', label: 'UI/UX 介面設計' },
        { key: 'app-web', label: '網頁與行動 App 開發' }
      ];

      async function getAvailableTags() {
        try {
          if (window.AppPreferences && typeof window.AppPreferences.loadTags === 'function') {
            return await window.AppPreferences.loadTags();
          }
        } catch (e) {}
        return defaultTags;
      }

      async function getUserSavedPreferences() {
        try {
          if (window.AppPreferences && typeof window.AppPreferences.loadUserPreferences === 'function') {
            return await window.AppPreferences.loadUserPreferences(id);
          }
        } catch (e) {}
        return JSON.parse(localStorage.getItem(`userPref:${id}`) || '[]');
      }

      async function renderPreferences(){
        const tags = await getAvailableTags();
        preferenceTags.innerHTML = tags.map(tag => `
          <button class="preference-chip ${selectedPreferences.includes(tag.key) ? 'active' : ''}" type="button" data-preference="${tag.key}">
            ${tag.label}
          </button>
        `).join('');
      }

      async function initPreferences(){
        selectedPreferences = await getUserSavedPreferences();
        await renderPreferences();
      }

      preferenceTags.addEventListener('click', event => {
        const chip = event.target.closest('[data-preference]');
        if (!chip) return;
        const key = chip.dataset.preference;
        selectedPreferences = selectedPreferences.includes(key)
          ? selectedPreferences.filter(item => item !== key)
          : [...selectedPreferences, key];
        renderPreferences();
      });

      document.getElementById('savePreferences').addEventListener('click', async () => {
        preferenceStatus.textContent = '儲存中...';
        localStorage.setItem(`userPref:${id}`, JSON.stringify(selectedPreferences));

        try {
          if (window.AppPreferences && typeof window.AppPreferences.saveUserPreferences === 'function') {
            const result = await window.AppPreferences.saveUserPreferences(id, selectedPreferences);
            preferenceStatus.textContent = result.localOnly ? '已保存本機；登入正式帳號寫入資料庫' : (result.ok ? '✅ 已儲存偏好' : (result.error || '儲存失敗'));
          } else {
            preferenceStatus.textContent = '✅ 已成功儲存個人化偏好！';
          }
        } catch (e) {
          preferenceStatus.textContent = '✅ 已成功儲存個人化偏好！';
        }
      });

      // 初始化啟動
      fetchAccountDataFromServer();
      initPreferences();
    </script>
  </body>
</html>
