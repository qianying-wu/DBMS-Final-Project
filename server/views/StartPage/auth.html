<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>歡迎加入競賽組隊平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #d4b188;
        --primary-dark: #bf9465;
        --accent: #4f3827;
        --text-main: #333333;
        --text-muted: #7b6a59;
        --bg-light: #faf7f2;
        --input-border: #dfcfbd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Noto Sans TC', Arial, sans-serif; 
        background: linear-gradient(135deg, #fffcf7 0%, #f5ece1 100%); 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        margin: 0;
        padding: 20px;
      }

      /* 現代感卡片 */
      .card {
        background: #ffffff;
        padding: 40px 32px;
        border-radius: 20px;
        width: 100%;
        max-width: 420px; 
        box-shadow: 0 12px 40px rgba(107, 79, 58, 0.08); 
        border: 1px solid rgba(212, 177, 136, 0.2);
      }

      /* 品牌識別區：改為置中並配置圖片Logo */
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
        text-align: center;
      }

      .logo-img {
        height: 48px; /* 調整為主流精緻的 Logo 高度 */
        width: auto;
        object-fit: contain;
      }

      h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.5px;
      }

      /* 滑塊膠囊風格的分頁切換 (Tab) */
      .tabs {
        display: flex;
        background: #f4eae1;
        padding: 4px;
        border-radius: 12px;
        margin-bottom: 24px;
        gap: 4px;
      }

      .tab {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .tab.active {
        background: #ffffff;
        color: var(--accent);
        font-weight: 700;
        box-shadow: 0 2px 8px rgba(107, 79, 58, 0.1);
      }

      /* 表單與現代化輸入框設計 */
      .form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      input.form-control {
        width: 100%;
        height: 46px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--input-border);
        background: #fffcf9;
        color: var(--text-main);
        font-size: 14px;
        outline: none;
        transition: all 0.2s ease;
      }

      input.form-control:focus {
        border-color: var(--primary-dark);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(212, 177, 136, 0.15);
      }

      /* 個人化偏好面板 */
      .preference-panel {
        background: #fffcf9;
        border: 1px dashed var(--input-border);
        border-radius: 12px;
        padding: 16px;
        margin-top: 8px;
        transition: all 0.3s ease;
      }

      .preference-panel h3 {
        margin: 0 0 6px 0;
        font-size: 14px;
        color: var(--accent);
        font-weight: 700;
      }

      .preference-panel p {
        margin: 0 0 14px 0;
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .preference-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .preference-chip {
        border: 1px solid var(--input-border);
        background: #ffffff;
        color: var(--text-muted);
        border-radius: 20px;
        padding: 6px 14px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .preference-chip:hover {
        background: #fff6ec;
        border-color: var(--primary);
      }

      .preference-chip.active {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent);
        box-shadow: 0 2px 6px rgba(79, 56, 39, 0.2);
      }

      /* 按鈕樣式 */
      .btn-primary {
        width: 100%;
        height: 48px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(191, 148, 101, 0.25);
        transition: all 0.2s ease;
        margin-top: 8px;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(191, 148, 101, 0.35);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      .btn-secondary {
        background: transparent;
        color: var(--text-muted);
        border: none;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
        text-decoration: underline;
        margin-top: 4px;
        transition: color 0.2s;
      }

      .btn-secondary:hover {
        color: var(--accent);
      }

      .hide {
        display: none !important;
      }

      #out {
        margin-top: 16px;
        font-size: 12px;
        color: #b64d45;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">

        <img src="/logo.png" alt="競賽組隊 Logo" class="logo-img">
        <h2 id="title">歡迎回來</h2>
      </div>

      <div class="tabs">
        <button id="toLogin" class="tab active">帳號登入</button>
        <button id="toRegister" class="tab">新用戶註冊</button>
      </div>

      <div id="form" class="form">
        <input id="account" class="form-control" placeholder="請輸入帳號 (Account)">
        <input id="password" class="form-control" placeholder="請輸入密碼 (Password)" type="password">
        <input id="username" class="form-control" placeholder="請輸入您的暱稱 (Username)">
        <input id="userEmail" class="form-control" placeholder="請輸入電子信箱 (Email)">

        <button id="submit" class="btn-primary">確認登入</button>
        <button id="back" class="btn-secondary">返回首頁</button>
        
        <div id="out"></div>
      </div>
    </div>

    <!-- <script src="/preferences-data.js"></script> -->
    <script src="/auth.js"></script>
  </body>
</html>
