<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>比賽詳情 / 組隊</title>
    <link rel="stylesheet" href="/contest.css">
  </head>
  <body>
    <header class="topbar">
      <!-- <button id="backBtn" class="icon-btn" aria-label="回到組隊">←</button> -->
      <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
      <div class="actions">
        <button id="notifyBtn" class="icon-btn" aria-label="通知">🔔</button>
        <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">👤</button>
      </div>
    </header>

    <main class="contest-layout">
      <section class="main-panel">
        <section id="contestSummary" class="contest-summary"></section>

        <section class="main-section">
          <div class="section-heading">
            <h3>比賽資訊</h3>
            <button id="createBtn" class="btn primary">創建自己的隊伍 +</button>
          </div>
          <div id="contestInfo" class="info-box"></div>
        </section>

        <section class="main-section">
          <h3>其它隊伍</h3>
          <div id="teamCards" class="team-cards"></div>
        </section>
      </section>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card" role="document">
        <h3>創建新隊伍</h3>
        <label>隊名
          <input id="newTeamName">
        </label>
        <label>主題/說明
          <textarea id="newTeamDesc" rows="3"></textarea>
        </label>
        <div class="modal-actions">
          <button id="modalCreate" class="btn primary">建立</button>
          <button id="modalCancel" class="btn outline">取消</button>
        </div>
      </div>
    </div>

    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script src="/contest.js"></script>
  </body>
</html>
