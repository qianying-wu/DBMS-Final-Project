<body>
  <!-- 頁首：保留通知與帳號選單入口。 -->
  <header class="topbar">
    <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
    <div class="actions">
      <!--右上的通知和個人icon圖示-->
      <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 履歷查看區 -->
  <main class="layout" style="grid-template-columns: 1fr; max-width: 840px; margin: 0 auto; padding: 40px 20px;">
    <section class="content">

      <!-- 上方標題與導航欄 -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
        <h2 class="page-title" style="margin: 0; font-size: 24px; color: #3f342c; font-weight: 800;">履歷詳細資料</h2>
        <button id="backBtnResume" class="btn outline"
          style="height: 42px; display: flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          返回上一頁
        </button>
      </div>

      <!-- 履歷主體卡片 -->
      <div class="resume-template" id="resumeView"></div>

      <!-- ★ 經驗履歷連結區塊 ★ -->
      <div id="expLinkBlock" style="margin-top: 24px; display: none;">
        <div class="card"
          style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; background: #fff; border: 1px solid #eadfd2; border-radius: 16px;">
          <div>
            <div
              style="font-weight: 800; color: #4f3827; margin-bottom: 6px; font-size: 15px; display: flex; align-items: center; gap: 6px;">
              <span>📋</span> 經驗履歷檔案已連動
            </div>
            <div id="expLinkSummary" style="color: #7b6a59; font-size: 13px; line-height: 1.4;"></div>
          </div>
          <a id="expLinkBtn" href="#" class="btn primary"
            style="white-space: nowrap; height: 42px; line-height: 42px; padding: 0 20px; text-decoration: none; display: inline-flex; align-items: center;">查看完整經驗
            →</a>
        </div>
      </div>
    </section>
  </main>
