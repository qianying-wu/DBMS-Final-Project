<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>履歷查看</title>
    <link rel="stylesheet" href="/profile.css">
  </head>
  <body>
    <!-- 頁首：保留通知與帳號選單入口。 -->
    <header class="topbar">
      <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
      <div class="actions">
        <button id="notifyBtn" class="icon-btn" aria-label="通知">🔔</button>
        <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">👤</button>
      </div>
    </header>

    <!-- 履歷查看區：內容會由下方 script 依 resumeId 動態填入。 -->
    <main class="layout" style="grid-template-columns:1fr;max-width:820px;margin:0 auto">
      <section class="content">
        <h2 class="page-title">履歷查看</h2>
        <div class="resume-template" id="resumeView"></div>

        <!-- ★ 經驗履歷連結區塊（有資料時才顯示） ★ -->
        <div id="expLinkBlock" style="margin-top:18px;display:none">
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px">
            <div>
              <div style="font-weight:700;color:#4f3827;margin-bottom:4px">📋 經驗履歷</div>
              <div id="expLinkSummary" style="color:#7b6a59;font-size:13px"></div>
            </div>
            <a id="expLinkBtn" href="#" class="btn outline" style="white-space:nowrap">查看經驗 →</a>
          </div>
        </div>
      </section>
    </main>
    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script>
      // 讀取網址參數，決定目前使用者與要查看的履歷。
      const qs = new URLSearchParams(location.search);
      const userId = qs.get('userId') || 'unknown';
      document.querySelector('.logo-link').href = '/user.html?userId=' + encodeURIComponent(userId);

      // 從 localStorage 找出指定履歷；找不到時退回目前啟用或第一份履歷。
      const resumeId = qs.get('resumeId');
      const profiles = JSON.parse(localStorage.getItem('profiles') || '[]');
      const profile = profiles.find(p => String(p.id) === String(resumeId)) || profiles.find(p => String(p.id) === String(localStorage.getItem('activeProfileId'))) || profiles[0];
      const data = profile?.data || {};

      // 輸出到模板前先轉義，避免使用者輸入影響頁面結構。
      function esc(value){
        return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      }

      // 將履歷資料套入制式履歷版型。
      document.getElementById('resumeView').innerHTML = profile ? `
        <header class="resume-template-head">
          <div class="resume-avatar">${data.photo ? `<img src="${esc(data.photo)}" alt="">` : '<span>履歷</span>'}</div>
          <div>
            <p>標準履歷模板</p>
            <h3>${esc(profile.name || data.name || '履歷')}</h3>
            <span>${esc(data.school || '未填寫學校')} ${esc(data.grade || '')}</span>
          </div>
        </header>
        <section class="template-section">
          <h4>基本資料</h4>
          <div class="template-grid">
            <div><strong>姓名</strong><span>${esc(data.name || '未填寫')}</span></div>
            <div><strong>學校 / 年級</strong><span>${esc(data.school || '未填寫')} ${esc(data.grade || '')}</span></div>
          </div>
        </section>
        <section class="template-section">
          <h4>專長</h4>
          <div class="template-tags">${(data.tags || []).length ? data.tags.map(tag => `<span>${esc(tag)}</span>`).join('') : '<em>未填寫</em>'}</div>
        </section>
        <section class="template-section">
          <h4>個人經歷</h4>
          <p>${esc(data.experience || '未填寫')}</p>
        </section>
        <section class="template-section">
          <h4>自我介紹</h4>
          <p>${esc(data.intro || '未填寫')}</p>
        </section>
      ` : '<div class="empty-note">尚未建立履歷</div>';

      // ★ 若該使用者有經驗履歷，顯示連結區塊 ★
      (function () {
        const expList = JSON.parse(localStorage.getItem('experiences:' + userId) || '[]');
        if (!expList.length) return;
        const block = document.getElementById('expLinkBlock');
        const summary = document.getElementById('expLinkSummary');
        const btn = document.getElementById('expLinkBtn');
        block.style.display = '';
        summary.textContent = `共 ${expList.length} 筆經歷，包含：${expList.slice(0, 3).map(e => e.title || '未命名').join('、')}${expList.length > 3 ? ' 等' : ''}`;
        const base = location.protocol === 'file:' ? 'experience-view.html' : '/experience-view.html';
        btn.href = base + '?userId=' + encodeURIComponent(userId);
      })();
    </script>
  </body>
</html>
