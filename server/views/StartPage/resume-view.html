<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>履歷查看</title>
    <link rel="stylesheet" href="/profile.css">
  </head>
  <body>
    <header class="topbar">
      <a class="logo-link" href="/team.html"><div class="logo">競賽組隊</div></a>
      <div class="actions">
        <button id="notifyBtn" class="icon-btn" aria-label="通知">🔔</button>
        <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">👤</button>
      </div>
    </header>
    <main class="layout" style="grid-template-columns:1fr;max-width:820px;margin:0 auto">
      <section class="content">
        <h2 class="page-title">履歷查看</h2>
        <div class="resume-template" id="resumeView"></div>
      </section>
    </main>
    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script>
      const qs = new URLSearchParams(location.search);
      const userId = qs.get('userId') || 'unknown';
      document.querySelector('.logo-link').href = '/user.html?userId=' + encodeURIComponent(userId);
      const resumeId = qs.get('resumeId');
      const profiles = JSON.parse(localStorage.getItem('profiles') || '[]');
      const profile = profiles.find(p => String(p.id) === String(resumeId)) || profiles.find(p => String(p.id) === String(localStorage.getItem('activeProfileId'))) || profiles[0];
      const data = profile?.data || {};
      function esc(value){
        return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      }
      document.getElementById('resumeView').innerHTML = profile ? `
        <header class="resume-template-head">
          <div class="resume-avatar">${data.photo ? `<img src="${esc(data.photo)}" alt="">` : '<span>履歷</span>'}</div>
          <div>
            <p>標準履歷模板</p>
            <h3>${esc(profile.name || data.name || '履歷')}</h3>
            <span>${esc(data.school || '未填寫學校')} ${esc(data.grade || '')}</span>
          </div>
        </header>
        <section class="template-section">
          <h4>基本資料</h4>
          <div class="template-grid">
            <div><strong>姓名</strong><span>${esc(data.name || '未填寫')}</span></div>
            <div><strong>學校 / 年級</strong><span>${esc(data.school || '未填寫')} ${esc(data.grade || '')}</span></div>
          </div>
        </section>
        <section class="template-section">
          <h4>專長</h4>
          <div class="template-tags">${(data.tags || []).length ? data.tags.map(tag => `<span>${esc(tag)}</span>`).join('') : '<em>未填寫</em>'}</div>
        </section>
        <section class="template-section">
          <h4>個人經歷</h4>
          <p>${esc(data.experience || '未填寫')}</p>
        </section>
        <section class="template-section">
          <h4>自我介紹</h4>
          <p>${esc(data.intro || '未填寫')}</p>
        </section>
      ` : '<div class="empty-note">尚未建立履歷</div>';
    </script>
  </body>
</html>
