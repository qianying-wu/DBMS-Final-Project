<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>探索競賽 - 競賽組隊平台</title>
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="contests.css">
</head>

<body>
  <header class="topbar">
    <a id="homeLink" href="/contests.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
    <div id="authAction" class="loginBtn">
      <a href="/auth.html">登入</a>
    </div>
    <div id="userActions" class="actions" style="display: none;">
      <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
      </button>
    </div>
  </header>

  <main class="layout-single">
    <section class="hero-section">
      <h1>探索熱門競賽</h1>
      <p>尋找感興趣的領域，查看詳情並開始組隊。</p>
      <div class="filter-bar">
        <input type="text" id="contestSearch" placeholder="輸入關鍵字搜尋比賽...">
          <!--<select id="categoryFilter">
        <option value="all">所有分類</option>
          <option value="AI">人工智慧</option>
          <option value="Design">設計與創意</option>
          <option value="Business">商業競賽</option>
        </select>-->
      </div>
    </section>

    <section id="recommendedSection" class="recommended-section hidden" aria-labelledby="recommendedTitle">
      <div class="recommended-heading">
        <div>
          <span class="section-kicker">Personal Picks</span>
          <h2 id="recommendedTitle">專屬推薦比賽</h2>
        </div>
        <p>依照你的偏好與熱門主題挑出適合先看的比賽。</p>
      </div>
      <div id="recommendedGrid" class="recommended-grid">
        <div class="empty-note">推薦比賽載入中...</div>
      </div>
    </section>

    <div id="contestsGrid" class="contests-grid">

    </div>
  </main>
  <script type="module" src="/contests.js"></script>
  <script type="module" src="/preferences.js"></script>
  <script src="/auth-guard.js"></script>
  <script src="/account-menu.js"></script>
</body>

</html>
