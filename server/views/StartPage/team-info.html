<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>隊伍資訊</title>
    <link rel="stylesheet" href="/create-team.css"> 
    <link rel="stylesheet" href="/team-info.css"> 
  </head>
  <body>
    <header class="topbar">
      <a id="homeLink" href="/contests.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
      <div class="actions">
          <!--右上的通知和個人icon圖示-->

<button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
  </svg>
</button>
      </div>
    </header>

    <main class="create-layout">
      <section class="main-panel">
        <section class="info-section">
          <div class="section-heading">
            <h2 id="displayTeamName">隊伍名稱載入中...</h2>
            <span id="displayContestLabel" class="contest-label">比賽名稱</span>
            <button id="editTeamBtn" class="btn outline hidden" type="button">編輯隊伍</button>
          </div>

          <div class="info-block status-block">
            <div class="status-item">
              <strong>招募進度：</strong> 
              <span id="displayMemberCount">1</span> / <span id="displayMaxSlots">4</span> 人
            </div>
            <!-- <div class="status-item">
              <strong>需求技能：</strong> 
              <span id="displaySkills" class="skills-tags">前端、資料分析</span>
            </div> -->
          </div>

          <div class="info-block contest-detail-block">
            <h3>比賽詳細資訊</h3>
            <div class="contest-detail-grid">
              <div>
                <strong>比賽名稱</strong>
                <span id="displayContestName">比賽名稱</span>
              </div>
              <div>
                <strong>比賽日期</strong>
                <span id="displayContestDate">日期未定</span>
              </div>
            </div>
            <p id="displayContestInfo" class="desc-text">比賽資訊會顯示在這裡。</p>
          </div>

          <div class="info-block">
            <h3>主題 / 說明</h3>
            <p id="displayDesc" class="desc-text">
              隊伍說明的詳細內容會顯示在這裡。
            </p>
          </div>

          <div class="info-block">
            <h3>目前成員</h3>
            <ul id="memberList" class="member-list">
              </ul>
          </div>

          <div id="applicationBlock" class="application-block">
            <div id="actionButtons" class="form-actions">
              <button id="applyBtn" class="btn primary" type="submit">我要申請</button>
            </div>
          </div>

        </section>
      </section>
    </main>

    <div id="resumeModal" class="custom-modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>選擇送出的履歷</h3>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <p style="color: #8a735e; margin-bottom: 15px; font-size: 14px;">請點擊選擇一份您想附帶送給隊長的個人履歷：</p>
          
          <div id="resumeListContainer" class="resume-buttons-list">
            </div>
          
          <input type="hidden" id="hiddenResumeId">
        </div>
        <div class="modal-footer">
          <button id="cancelModalBtn" class="btn-modal-secondary">取消</button>
          <button id="confirmApplyBtn" class="btn-modal-primary" disabled>確認送出申請</button>
        </div>
      </div>
    </div>
    <div id="editTeamModal" class="custom-modal" style="display: none;">
      <div class="modal-content edit-team-modal-content">
        <div class="modal-header">
          <h3>編輯隊伍資料</h3>
          <button id="closeEditTeamModalBtn" class="close-btn" type="button">&times;</button>
        </div>
        <form id="editTeamForm" class="edit-team-form">
          <label>
            隊伍名稱
            <input id="editTeamName" type="text" maxlength="80" required>
          </label>
          <label>
            隊伍人數上限
            <input id="editTeamSlots" type="number" min="1" max="12" required>
          </label>
          <label class="full">
            招募需求
            <input id="editTeamSkills" type="text" maxlength="300" required>
          </label>
          <label class="full">
            主題 / 說明
            <textarea id="editTeamDesc" rows="6" maxlength="1000" required></textarea>
          </label>
          <div class="modal-footer">
            <button id="cancelEditTeamBtn" class="btn-modal-secondary" type="button">取消</button>
            <button id="saveEditTeamBtn" class="btn-modal-primary" type="submit">儲存變更</button>
          </div>
        </form>
      </div>
    </div>
    <script src="/team-info.js"></script>
    <script src="/account-menu.js"></script>
  </body>
</html>
