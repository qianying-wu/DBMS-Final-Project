<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>經驗履歷查看</title>
    <link rel="stylesheet" href="/profile.css">
  </head>
  <body>
    <header class="topbar">
      <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
      <div class="actions">
       <button id="notifyBtn" class="icon-btn" aria-label="通知">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
<button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
  </svg>
</button>
      </div>
    </header>

    <main class="layout" style="grid-template-columns:1fr;max-width:820px;margin:0 auto">
      <section class="content">
        <h2 class="page-title">經驗履歷</h2>
        <div id="expViewContainer"></div>
      </section>
    </main>

    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script>
      const qs = new URLSearchParams(location.search);
      const userId = qs.get('userId') || 'unknown';

      document.querySelector('.logo-link').href =
        userId !== 'unknown' ? '/team.html?userId=' + encodeURIComponent(userId) : '/team.html';

      function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
        );
      }

      function formatDate(iso) {
        if (!iso) return '未填寫';
        const d = new Date(iso);
        if (isNaN(d)) return iso;
        return d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
      }

      const list = JSON.parse(localStorage.getItem('experiences:' + userId) || '[]');
      const container = document.getElementById('expViewContainer');

      if (!list.length) {
        container.innerHTML = '<div class="empty-note">此使用者尚未填寫任何經歷。</div>';
      } else {
        container.innerHTML = `
          <div class="resume-template">
            <header class="resume-template-head">
              <div class="resume-avatar"><span>經歷</span></div>
              <div>
                <p>經驗履歷</p>
                <h3>共 ${list.length} 筆經歷</h3>
                <span>userId: ${esc(userId)}</span>
              </div>
            </header>
            ${list.map(item => `
              <section class="template-section">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                  <span class="exp-type-badge">${esc(item.exp_type || '未分類')}</span>
                  <h4 style="margin:0;color:#4f3827">${esc(item.title || '未命名')}</h4>
                </div>
                <div style="color:#888;font-size:13px;margin-bottom:8px">📅 ${esc(formatDate(item.exp_date))}</div>
                ${item.exp_desc ? `<p style="margin:0;color:#55483d;line-height:1.7;white-space:pre-line">${esc(item.exp_desc)}</p>` : ''}
              </section>
            `).join('')}
          </div>
        `;
      }
    </script>
  </body>
</html>
