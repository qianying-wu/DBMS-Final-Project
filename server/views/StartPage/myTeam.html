<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="myTeam.css">
    <link rel="stylesheet" href="modules/tabMyTeams.css">
    <title>隊伍管理中心</title>
</head>
<body>
    <header class="topbar">
        <a id="homeLink" href="contests.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
        <div class="actions">
            <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="layout-manage">
        
        <aside class="manage-sidebar">
            <div class="sidebar-title">隊伍管理中心</div>
            <nav class="manage-menu" role="tablist">              
                <button class="menu-item active" data-team-tab="my-teams" type="button">
                    <span class="menu-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M16 20v-1.5c0-2.2-1.8-4-4-4H7c-2.2 0-4 1.8-4 4V20"/>
                            <circle cx="9.5" cy="7.5" r="3.5"/>
                            <path d="M21 20v-1.2c0-1.8-1.2-3.3-2.8-3.8"/>
                            <path d="M16.5 4.4a3.4 3.4 0 0 1 0 6.2"/>
                        </svg>
                    </span> 我的隊伍
                </button>
                <button class="menu-item" data-team-tab="search-talent" type="button">
                    <span class="menu-icon" aria-hidden="true">
                         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                             <circle cx="11" cy="11" r="8"></circle>
                             <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span> 探索人才與隊伍
                </button>  
                <button class="menu-item" data-team-tab="favorites-teams" type="button">
                    <span class="menu-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="m3 8 4.2 3.4L12 4l4.8 7.4L21 8l-2 11H5L3 8Z"/>
                            <path d="M6.5 15.5h11"/>
                        </svg>
                    </span> 我的收藏隊伍
                </button>
                <button class="menu-item" data-team-tab="favorites-com" type="button">
                    <span class="menu-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 20.5s-7.5-4.6-9.2-9.1C1.7 8.5 3.5 5.5 6.5 5.5c1.8 0 3.2 1 4 2.3.8-1.3 2.2-2.3 4-2.3 3 0 4.8 3 3.7 5.9C16.5 15.9 12 20.5 12 20.5Z"/>
                        </svg>
                    </span> 我的收藏比賽
                </button>
                <button class="menu-item" data-team-tab="history" type="button">
                    <span class="menu-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 12a8 8 0 1 0 2.3-5.7"/>
                            <path d="M4 4.8v4.5h4.5"/>
                            <path d="M12 8v4.4l3 1.8"/>
                        </svg>
                    </span> 歷史紀錄隊伍
                </button>
            </nav>
        </aside>

        <main class="manage-content">
            
            <section class="content-section">
                <h2 id="currentTabTitle" class="section-main-title">
                    <span class="title-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M16 20v-1.5c0-2.2-1.8-4-4-4H7c-2.2 0-4 1.8-4 4V20"/>
                            <circle cx="9.5" cy="7.5" r="3.5"/>
                            <path d="M21 20v-1.2c0-1.8-1.2-3.3-2.8-3.8"/>
                            <path d="M16.5 4.4a3.4 3.4 0 0 1 0 6.2"/>
                        </svg>
                    </span>
                    <span>已加入的隊伍</span>
                </h2>
                
                <div id="teamsGrid" class="teams-management-grid">
                    <div class="loading-placeholder">資料載入中...</div>
                </div>
            </section>

        </main>
    </div>

    <div id="viewResumeModal" class="custom-modal" style="display: none;">
        <div class="modal-content" style="max-width: 500px;">
          <div class="modal-header">
            <h3 id="viewResumeTitle">隊員履歷詳細資料</h3>
            <button id="closeViewModalBtn" class="close-btn">&times;</button>
          </div>
          <div class="modal-body">
            <div id="viewResumeDetailCard" class="resume-detail-preview">
              <p style="text-align: center; color: #8a735e;">正在拼命讀取履歷資料...</p>
            </div>
          </div>
        </div>
      </div>

    <script src="account-menu.js"></script>
    <script type="module" src="myTeam.js"></script>
</body>
</html>
