<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="myTeam.css">
    <title>隊伍管理中心</title>
</head>
<body>
    <header class="topbar">
        <a id="homeLink" href="contests.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
        <div class="actions">
            <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="layout-manage">
        
        <aside class="manage-sidebar">
            <div class="sidebar-title">隊伍管理中心</div>
            <nav class="manage-menu" role="tablist">
                <button class="menu-item active" data-team-tab="joined" type="button">
                    <span class="menu-icon">👥</span> 已加入的隊伍
                </button>
                <button class="menu-item" data-team-tab="owned" type="button">
                    <span class="menu-icon">👑</span> 我建立的隊伍
                </button>
                <button class="menu-item" data-team-tab="favorites" type="button">
                    <span class="menu-icon">♥</span> 我的收藏隊伍
                </button>
                <button class="menu-item" data-team-tab="history" type="button">
                    <span class="menu-icon">🕒</span> 歷史紀錄隊伍
                </button>
            </nav>
        </aside>

        <main class="manage-content">
            
            <section class="content-section">
                <h2 id="currentTabTitle" class="section-main-title">已加入的隊伍</h2>
                
                <div id="teamsGrid" class="teams-management-grid">
                    <div class="loading-placeholder">資料載入中...</div>
                </div>
            </section>

            <div class="contests-summary-zone">
                <section class="summary-box">
                    <h3 class="sub-zone-title">📌 關注的比賽與動態</h3>
                    <div id="followed" class="summary-list-vertical">
                        <div class="empty-text">暫無關注的比賽</div>
                    </div>
                </section>

                <section id="recommendedContests" class="summary-box">
                    <h3 class="sub-zone-title">✨ 專屬推薦比賽</h3>
                    <div id="recommendedBody" class="summary-list-vertical">
                        </div>
                </section>
            </div>

        </main>
    </div>

    <script src="account-menu.js"></script>
    <script type="module" src="myTeam.js"></script>
</body>
</html>
