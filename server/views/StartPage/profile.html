<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個人履歷</title>
  <link rel="stylesheet" href="/profile.css">
</head>

<body>
  <header class="topbar">
    <a class="logo-link" href="/team.html">
      <img src="/logo.png" alt="競賽組隊 Logo" class="logo-img">
    </a>
    <div class="actions">
      <button id="notifyBtn" class="icon-btn" aria-label="通知">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
      </button>
      <button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
      </button>
    </div>
  </header>

  <main class="layout profile-layout">
    
    <aside class="sidebar">
      <div class="card user-card">
        <div class="user-info">
          <div id="userAvatar" class="avatar">👤</div>
          <div>
            <h3 id="profileUsername" class="user-name">載入中...</h3>
            <p id="profileUserEmail" class="user-email">...</p>
          </div>
        </div>
        <div class="user-actions">
          <a id="teamBtn" class="btn outline" style="width:100%; text-align:center; text-decoration:none; display:block; box-sizing:border-box;">發起/尋找隊伍</a>
        </div>
      </div>

      <div class="card side-card">
        <div class="side-card-header">
          <h4>我的隊伍</h4>
        </div>
        <ul id="myTeams" class="simple-list">
          <li class="loading-item">載入中...</li>
        </ul>
      </div>

      <div class="card side-card">
        <div class="side-card-header">
          <h4>關注的競賽</h4>
        </div>
        <ul id="followed" class="simple-list">
          <li class="loading-item">載入中...</li>
        </ul>
      </div>
    </aside>

    <section class="content profile-content">
      
      <div id="resumeHome" class="resume-home">
        <div class="profile-heading">
          <div>
            <h2 class="page-title">個人履歷</h2>
            <p>建立不同用途的履歷，申請隊伍時可以選擇要附上的版本。</p>
          </div>
        </div>

        <div id="resumeGallery" class="resume-gallery">
          </div>
      </div>

      <div id="resumeEditor" class="card editor-card" hidden>
        <div class="editor-heading">
          <div>
            <div class="editor-title-row">
              <h2 id="editorTitle" class="editor-title" contenteditable="true" spellcheck="false" aria-label="編輯履歷名稱">新增履歷</h2>
              <button id="editorRenameBtn" class="rename-btn" type="button" aria-label="編輯履歷名稱">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" fill="currentColor" />
                  <path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor" />
                </svg>
              </button>
            </div>
          </div>
          <div class="editor-actions">
            <button id="backToGallery" type="button" class="btn outline">返回列表</button>
            <button id="viewResumeBtn" type="button" class="btn outline">查看制式履歷</button>
          </div>
        </div>
