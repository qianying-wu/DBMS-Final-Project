<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>經驗履歷</title>
    <link rel="stylesheet" href="/profile.css">
  </head>
  <body>
    <header class="topbar">
      <a class="logo-link" href="/team.html"><img src="/logo.png" alt="競賽組隊 Logo" class="logo-img"></a>
      <div class="actions">
        <!--右上的通知和個人icon圖示-->
      <div class="actions">
       <button id="notifyBtn" class="icon-btn" aria-label="通知">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </svg>
</button>
<button id="avatarBtn" class="avatar-btn" aria-label="個人檔案">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
  </svg>
</button>
      </div>
    </header>

    <main class="profile-layout">
      <section class="profile-content">
        <div class="profile-heading">
          <div>
            <h2 class="page-title">經驗履歷</h2>
            <p>記錄你的實習、競賽、專案等經歷，申請隊伍時對方可查看此紀錄。每位使用者只有一份，可隨時新增或編輯條目。</p>
          </div>
          <div class="editor-actions">
            <button id="backBtn" class="btn outline">← 返回個人履歷</button>
            <button id="addExpBtn" class="btn primary">＋ 新增經歷</button>
          </div>
        </div>

        <!-- 經歷列表 -->
        <div id="expList" class="exp-list"></div>

        <!-- 新增 / 編輯 Modal -->
        <div id="expModal" class="modal" hidden>
          <div class="modal-card exp-modal-card">
            <h3 id="modalTitle">新增經歷</h3>
            <div class="row">
              <label class="full">經驗類型
                <input id="expType" type="text" placeholder="例：實習、競賽、專案、志工">
              </label>
            </div>
            <div class="row">
              <label class="full">職位 / 專案名稱
                <input id="expTitle" type="text" placeholder="擔任的職位或專案名稱">
              </label>
            </div>
            <div class="row">
              <label class="full">開始日期
                <input id="expDate" type="date">
              </label>
            </div>
            <div class="row">
              <label class="full">內容描述
                <textarea id="expDesc" rows="5" placeholder="描述你的職責、成果或學習"></textarea>
              </label>
            </div>
            <div class="actions-row">
              <button id="saveExpBtn" class="btn primary">儲存</button>
              <button id="cancelExpBtn" type="button" class="btn outline"> 取消</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/notifications.js"></script>
    <script src="/account-menu.js"></script>
    <script src="/experience.js"></script>
  </body>
</html>
